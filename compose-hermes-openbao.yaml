json.dumps(payload).encode()\n        headers['Content-Type'] = 'application/json'\n    req = urllib.request.Request(BASE + path, data=data, headers=headers)\n    with opener.open(req, timeout=10) as response:\n        raw = response.read(1048577)\n        if len(raw) > 1048576:\n            raise ValueError('response too large')\n        return json.loads(raw) if raw else {}\n\ntry:\n    role_id = os.environ.pop('OPENBAO_MARIO_ROLE_ID', '')\n    secret_id = os.environ.pop('OPENBAO_MARIO_SECRET_ID', '')\n    if not role_id or not secret_id or os.environ.get('HERMES_RUN_PROFILE') != 'mario':\n        raise ValueError('configuration missing')\n    stage = 'authentification AppRole'\n    login = request('/v1/auth/approle/login', {'role_id': role_id, 'secret_id': secret_id})\n    token = login['auth']['client_token']\n    if not isinstance(token, str) or not token:\n        raise ValueError('invalid token')\n    stage = 'lecture hermes/mario/runtime'\n    values = request('/v1/hermes/data/mario/runtime', token=token)['data']['data']\n    # Ajouter des secrets sans modifier le Compose : noms de credentials uniquement.\n    credential_suffixes = ('_API_KEY', '_TOKEN', '_SECRET', '_PASSWORD',\n                           '_ACCESS_KEY', '_ACCESS_KEY_ID', '_PRIVATE_KEY')\n    reserved_prefixes = ('HERMES_', 'OPENBAO_', 'BAO_', 'VAULT_',\n                         'PYTHON', 'LD_', 'NODE_', 'BASH', 'NPM_',\n                         'SSL_', 'CURL_', 'GIT_', 'S6_', 'HTTP_', 'HTTPS_')\n    def allowed_name(name):\n        if not isinstance(name, str) or not re.fullmatch(r'[A-Z][A-Z0-9_]{0,127}', name):\n            return False\n        # Autorisation Telegram configurable dans le coffre, sans ouvrir tous les *_USERS.\n        if name in ('TEST_CONNECTION', 'TELEGRAM_ALLOWED_USERS'):\n            return True\n        return (not name.startswith(reserved_prefixes)\n                and name.endswith(credential_suffixes))\n    stage = 'validation des variables runtime autorisees'\n    if not isinstance(values, dict) or not values:\n        raise ValueError('empty runtime')\n    for name, value in values.items():\n        if not allowed_name(name) or not isinstance(value, str) or not value or '\\x00' in value:\n            raise ValueError('invalid runtime variable')\n    if values.get('TEST_CONNECTION') != 'ok':\n        raise ValueError('missing test marker')\n    stage = 'verification du refus hors profil'\n    for other in ('gaston', 'john'):\n        try:\n            request('/v1/hermes/data/' + other + '/test', token=token)\n        except urllib.error.HTTPError as error:\n            if error.code != 403:\n                raise\n        else:\n            raise ValueError('unexpected access outside profile')\n    stage = 'revocation du jeton de test'\n    request('/v1/auth/token/revoke-self', {}, token)\n    os.environ.update(values)\n    # Ne transmettre ni le Secret ID ni le jeton temporaire au processus Hermes.\n    del secret_id, role_id, token, login\n    print('[openbao] Mario : runtime charge ; ' + str(len(values)) + ' variable(s) autorisee(s) injectee(s) ; acces Gaston/John refuse ; jeton revoque.', flush=True)\n    stage = 'lancement Hermes'\n    os.execvpe('hermes', ['hermes', '--profile', 'mario', 'gateway', 'run', '--no-supervise'], os.environ.copy())\nexcept urllib.error.HTTPError as error:\n    print('[openbao] ECHEC ' + stage + ' : HTTP ' + str(error.code) + '. Mario ne demarre pas.', file=sys.stderr)\n    sys.exit(1)\nexcept Exception as error:\n    # Aucun corps de reponse, credential ou message d'exception potentiellement sensible.\n    print('[openbao] ECHEC ' + stage + ' (' + type(error).__name__ + '). Mario ne demarre pas.', file=sys.stderr)\n    sys.exit(1)\nPY_OPENBAO\n"
