      - 'hermes-workspace:/workspace'
    healthcheck:
      disable: true
    environment:
      - HERMES_HOME=/home/hermeswebui/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - 'BROWSER_CDP_URL=http://hermes-browser:9222'
      - 'OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}'
      - 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY:-}'
      - 'GOOGLE_API_KEY=${GOOGLE_API_KEY:-}'
      - HERMES_RUN_PROFILE=john
  gateway-mario:
    image: 'nousresearch/hermes-agent@sha256:2f1f2f1725e5dc9a61cf6a2dea5aca52a776ec4d022cb29679e6aa3ff303e77a'
