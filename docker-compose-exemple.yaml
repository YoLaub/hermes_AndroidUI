    mem_limit: 2g
    pids_limit: 400
    depends_on:
      hermes-browser:
        condition: service_healthy
      hermes-browser-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - '-ec'
      - "if ! command -v vim >/dev/null 2>&1; then\n  apt-get update\n  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends vim\n  rm -rf /var/lib/apt/lists/*\nfi\n# Ne pas relancer les autres profils dans chaque conteneur.\n# Modification du conteneur uniquement, pas du volume partage.\nrm -f /etc/cont-init.d/02-reconcile-profiles\nexec /init /opt/hermes/docker/main-wrapper.sh \"$$@\"\n"
