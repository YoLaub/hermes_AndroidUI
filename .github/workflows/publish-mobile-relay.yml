name: Publish mobile relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-relay/**"
      - ".github/workflows/publish-mobile-relay.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yolaub/hermes-mobile-relay

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./mobile-relay
          file: ./mobile-relay/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/YoLaub/hermes_AndroidUI