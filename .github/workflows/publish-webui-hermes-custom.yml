name: Publish custom Hermes WebUI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "webui-backend/**"
      - ".github/workflows/publish-webui-hermes-custom.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yolaub/hermes-webui-custom

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Hermes Version
        id: version
        run: |
          # Upstream Hermes WebUI version from baked version file
          VERSION=$(grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" webui-backend/api/_version.py 2>/dev/null || echo "v0.51.92")
          echo "hermes_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          SHA="sha-${{ github.sha }}"
          TAGS="${{ env.IMAGE_NAME }}:${SHA}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:main"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:dev"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./webui-backend
          file: ./webui-backend/Dockerfile
          push: true
          build-args: |
            HERMES_VERSION=${{ steps.version.outputs.hermes_version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/YoLaub/hermes_AndroidUI
            org.opencontainers.image.description=Custom Hermes WebUI backend image
