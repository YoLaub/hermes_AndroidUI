name: Publish custom Hermes WebUI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "webui-backend/**"
      - ".github/workflows/publish-webui-hermes-custom.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yolaub/hermes-webui-custom

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Hermes Version
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "custom-sha-${GITHUB_SHA::7}")
          echo "hermes_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./webui-backend
          file: ./webui-backend/Dockerfile
          push: true
          build-args: |
            HERMES_VERSION=${{ steps.version.outputs.hermes_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/YoLaub/hermes_AndroidUI
            org.opencontainers.image.description=Custom Hermes WebUI backend image
