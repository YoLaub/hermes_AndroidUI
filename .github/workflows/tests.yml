name: Tests

# Runs on every push to main/dev and on pull requests. The publish workflows only build images:
# nothing else checks the code before it ships.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, project code only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      # Scope and rules live in ruff.toml (vendored upstream WebUI code is excluded).
      - run: ruff check

  relay:
    name: Mobile relay (pytest, Python 3.11 like the image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mobile-relay/requirements.txt
      - run: pip install -r mobile-relay/requirements.txt
      - run: python -m pytest tests -q
        working-directory: mobile-relay

  android:
    name: Android app (unit tests and debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
        working-directory: android-app

  webui-mcp-agent:
    name: WebUI MCP tests (mcp 1.26 and the real agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # hermes-agent pins mcp 1.26 in its dev extra; the end-to-end test drives the real agent.
      - run: pip install pytest pyyaml "mcp==1.26.0" "hermes-agent==0.19.0"
      - run: python -m pytest tests -q
        working-directory: webui-backend

  webui-mcp-sdk2:
    name: WebUI MCP tests (mcp 2.x, no agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The end-to-end test needs the agent and is skipped here by design.
      - run: pip install pytest pyyaml "mcp>=2,<3"
      - run: python -m pytest tests -q
        working-directory: webui-backend
